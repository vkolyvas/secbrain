[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secbrain"
version = "0.1.0"
description = "RAG-powered cognitive memory for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.4.0",
    "requests>=2.31.0",
    "openai>=1.12.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["secbrain*"]
exclude = ["assets*"]

[project.scripts]
secbrain = "secbrain.cli:main"
