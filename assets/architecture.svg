<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14C290"/>
      <stop offset="100%" style="stop-color:#4C72DB"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="#0a0a0f"/>

  <!-- Title -->
  <text x="400" y="30" font-family="monospace" font-size="16" font-weight="bold" fill="#14C290" text-anchor="middle">secbrain Architecture</text>

  <!-- User/Agent Box -->
  <rect x="320" y="50" width="160" height="50" rx="8" fill="#1a1a2e" stroke="#14C290" stroke-width="1.5"/>
  <text x="400" y="73" font-family="monospace" font-size="13" fill="#14C290" text-anchor="middle">AI Agent / Claude Code</text>
  <text x="400" y="90" font-family="monospace" font-size="11" fill="#8888aa" text-anchor="middle">↑ query / store memories</text>

  <!-- MCP Server Box -->
  <rect x="320" y="130" width="160" height="50" rx="8" fill="#1a1a2e" stroke="#4C72DB" stroke-width="1.5"/>
  <text x="400" y="153" font-family="monospace" font-size="13" fill="#4C72DB" text-anchor="middle">MCP Server</text>
  <text x="400" y="170" font-family="monospace" font-size="11" fill="#8888aa" text-anchor="middle">tools: query, add, inject</text>

  <!-- Arrows from Agent to MCP -->
  <line x1="400" y1="100" x2="400" y2="130" stroke="url(#lineGrad)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#14C290"/>
    </marker>
  </defs>

  <!-- secbrain Core Box -->
  <rect x="250" y="210" width="300" height="80" rx="10" fill="#1a1a2e" stroke="#14C290" stroke-width="2"/>
  <text x="400" y="235" font-family="monospace" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">secbrain Core</text>
  <line x1="270" y1="245" x2="530" y2="245" stroke="#14C290" stroke-width="0.5" opacity="0.3"/>

  <!-- Core components row -->
  <text x="310" y="265" font-family="monospace" font-size="10" fill="#14C290" text-anchor="middle">query_memory()</text>
  <text x="400" y="265" font-family="monospace" font-size="10" fill="#14C290" text-anchor="middle">add_memory()</text>
  <text x="490" y="265" font-family="monospace" font-size="10" fill="#14C290" text-anchor="middle">inject_context()</text>

  <!-- Arrow from MCP to core -->
  <line x1="400" y1="180" x2="400" y2="210" stroke="url(#lineGrad)" stroke-width="1.5"/>
  <polygon points="400,208 395,198 405,198" fill="#14C290"/>

  <!-- Chroma Box -->
  <rect x="50" y="220" width="160" height="60" rx="8" fill="#1a1a2e" stroke="#4C72DB" stroke-width="1.5"/>
  <text x="130" y="245" font-family="monospace" font-size="13" fill="#4C72DB" text-anchor="middle">Chroma</text>
  <text x="130" y="262" font-family="monospace" font-size="10" fill="#8888aa" text-anchor="middle">Vector Store</text>
  <text x="130" y="275" font-family="monospace" font-size="10" fill="#8888aa" text-anchor="middle">collections / embeddings</text>

  <!-- Ollama Box -->
  <rect x="590" y="220" width="160" height="60" rx="8" fill="#1a1a2e" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="670" y="245" font-family="monospace" font-size="13" fill="#ff6b35" text-anchor="middle">Ollama</text>
  <text x="670" y="262" font-family="monospace" font-size="10" fill="#8888aa" text-anchor="middle">Embeddings</text>
  <text x="670" y="275" font-family="monospace" font-size="10" fill="#8888aa" text-anchor="middle">nomic-embed-text</text>

  <!-- Arrows to Chroma and Ollama -->
  <line x1="250" y1="250" x2="210" y2="250" stroke="#4C72DB" stroke-width="1.5"/>
  <polygon points="212,245 202,250 212,255" fill="#4C72DB"/>
  <line x1="550" y1="250" x2="590" y2="250" stroke="#ff6b35" stroke-width="1.5"/>
  <polygon points="588,245 598,250 588,255" fill="#ff6b35"/>

  <!-- Memory types bottom -->
  <rect x="80" y="320" width="640" height="60" rx="8" fill="#1a1a2e" stroke="#333355" stroke-width="1"/>
  <text x="400" y="340" font-family="monospace" font-size="11" fill="#8888aa" text-anchor="middle">Memory Types:</text>

  <rect x="110" y="350" width="90" height="22" rx="4" fill="#14C290" opacity="0.15" stroke="#14C290"/>
  <text x="155" y="365" font-family="monospace" font-size="11" fill="#14C290" text-anchor="middle">decision</text>

  <rect x="220" y="350" width="90" height="22" rx="4" fill="#4C72DB" opacity="0.15" stroke="#4C72DB"/>
  <text x="265" y="365" font-family="monospace" font-size="11" fill="#4C72DB" text-anchor="middle">pattern</text>

  <rect x="330" y="350" width="110" height="22" rx="4" fill="#ff6b35" opacity="0.15" stroke="#ff6b35"/>
  <text x="385" y="365" font-family="monospace" font-size="11" fill="#ff6b35" text-anchor="middle">architecture</text>

  <rect x="460" y="350" width="80" height="22" rx="4" fill="#ffd700" opacity="0.15" stroke="#ffd700"/>
  <text x="500" y="365" font-family="monospace" font-size="11" fill="#ffd700" text-anchor="middle">lesson</text>

  <rect x="560" y="350" width="130" height="22" rx="4" fill="#8888aa" opacity="0.15" stroke="#8888aa"/>
  <text x="625" y="365" font-family="monospace" font-size="11" fill="#8888aa" text-anchor="middle">+ custom types</text>
</svg>